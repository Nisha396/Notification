apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: notification-role-binding
  namespace: notification-namespace
  labels:
    app: notif-app
  annotations:
    description: "This is a role binding for my notification application"
subjects:
- kind: ServiceAccount
  name: notification-service-account
  namespace: notification-namespace
roleRef:
  kind: Role
  name: notification-role
  apiGroup: rbac.authorization.k8s.io 