apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-deployment
spec:
  replicas: 3
  selector:
    matchLabels:
      app: notif-app
  template:
    metadata:
      labels:
        app: notif-app
    spec:
      containers:
      - name: my-container
        image: nishabansal19/notification-service:22-098ec3001a5ec2fa448ca109e6ab5266a74da01d
        ports:
        - containerPort: 80
          env:
            - name: USERNAME
              valueFrom:
                  secretKeyRef:
                    name: notification-secret
                    key: username
            - name: PASSWORD
              valueFrom:
                  secretKeyRef:
                    name: notification-secret
                    key: password
            - name: CONFIG_VALUE
              valueFrom:
                  configMapKeyRef:
                    name: notification-config
                    key: value
        resources:
          limits:
            memory: "512Mi"
            cpu: "500m"
          requests:
            memory: "256Mi"
            cpu: "250m"
        livenessProbe:
          httpGet:
            - path: /health
              port: 80
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
          successThreshold: 1
        readinessProbe:
          httpGet:
            - path: /ready
              port: 80
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
          successThreshold: 1
        startupProbe:
          httpGet:
            - path: /health
              port: 80
          failureThreshold: 30
          periodSeconds: 10
      restartPolicy: Always
