name: Code Deployment Pipeline

on:
  push:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
    build-and-push-image:
      runs-on: ubuntu-latest
      steps:
        - name: Checkout repository
          uses: actions/checkout@v4

        - name: Set Image Tag
          run: echo "IMAGE_TAG=${{ github.run_number }}-${{ github.sha }}" >> $GITHUB_ENV

        - name: Lint java code
          run: ./mvnw verify

        - name: Run unit tests
          run: ./mvnw test

        - name: Lint Dockerfile
          run: hadolint Dockerfile

        - name: Codeql Analysis
          uses: github/github/codeql-action/init@v3
          with:
            languages: java

        - name: Auto build Java application
          run: github/github/codeql-action/autobuild@v3

        - name: Analyze code with CodeQL
          uses: github/github/codeql-action/analyze@v3

        - name: Build the Docker image
          run: docker build -t ${{ secrets.username }}/notification-service:${IMAGE_TAG} .

        - name: Scan Docker image for vulnerabilities
          uses: aquasecurity/trivy-action@master
          with:
            image-ref: ${{ secrets.username }}/notification-service:${IMAGE_TAG}
            format: 'table'
            exit-code: '1'
            ignore-unfixed: true

        - name: Log in to Docker Hub
          run: echo ${{ secrets.password }} | docker login -u ${{ secrets.username }} --password-stdin

        - name: Push the Docker image
          run: docker push ${{ secrets.username }}/notification-service:${IMAGE_TAG}

        - name: Update Image Tag in Deployment Manifest
          run: sed -i "s|notification-service:.*|notification-service:${IMAGE_TAG}|g" manifests/Deployment.yaml

        - name: Commit and push updated manifest
          run: |
            git config  user.name "github-actions"
            git config  user.email "github-actions@github.com"
            git add manifests/Deployment.yaml
            git commit -m "Update image tag to ${IMAGE_TAG}"
            git push origin main
              

