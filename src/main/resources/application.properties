spring.application.name=Notification Service
spring.profiles.active=test
management.endpoints.web.exposure.include=*
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=always
management.endpoint.prometheus.enabled=true
management.metrics.export.prometheus.enabled=true

# Bootstrap Servers
spring.kafka.bootstrap-servers=localhost:9092

# --- PRODUCER CONFIGURATIONS ---
# "all" ensures data is replicated to all broker nodes before acknowledging success
spring.kafka.producer.retries=3
spring.kafka.producer.topic=notification-topic
spring.kafka.producer.acks=1
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer

# --- CONSUMER CONFIGURATIONS ---
spring.kafka.consumer.group-id=notification-worker-group
spring.kafka.consumer.auto-offset-reset=earliest
# Turn off auto-commit to prevent message loss if a pod crashes mid-execution
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.listener.ack-mode=manual_immediate

# Wrap deserializers in ErrorHandlingDeserializer to catch deserialization exceptions
spring.kafka.consumer.key-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer

# Set the delegate deserializers
spring.kafka.consumer.properties.spring.deserializer.key.delegate.class=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JacksonJsonDeserializer

# Trusted packages for JSON deserialization security
spring.kafka.consumer.properties.spring.json.trusted.packages=org.demo.notification
spring.kafka.consumer.properties.spring.json.value.default.type=org.demo.notification.model.NotificationMessage

# Expose startup conditions and failure reports
debug=true

# Set detailed logging for Tomcat and Spring web lifecycle
logging.level.org.apache.catalina=DEBUG
logging.level.org.apache.tomcat=DEBUG
logging.level.org.springframework.boot=DEBUG
logging.level.org.springframework.kafka=DEBUG
